name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: corepack enable
      - run: corepack prepare npm@11.6.2 --activate
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - run: test -f dist/task-manager/browser/index.html
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium
