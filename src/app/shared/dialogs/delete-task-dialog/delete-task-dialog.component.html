<div class="dialog">
  <h2 class="dialog__title">Delete task</h2>
  <p class="dialog__copy">Delete “{{ data.task.title }}”? This cannot be undone.</p>
  <div class="dialog__actions">
    <button type="button" class="dialog__cancel" (click)="cancel()">Cancel</button>
    <button
      type="button"
      class="dialog__confirm"
      [disabled]="store.submitting()"
      (click)="confirm()"
    >
      {{ store.submitting() ? 'Deleting…' : 'Delete' }}
    </button>
  </div>
</div>
