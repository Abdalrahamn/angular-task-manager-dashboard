<form
  class="tw:flex tw:w-full tw:max-w-[480px] tw:flex-col tw:gap-[var(--space-16)] tw:p-[var(--space-24)]"
  [formGroup]="form"
  (ngSubmit)="submit()"
  novalidate
>
  <h2
    class="tw:m-0 tw:[font-size:var(--font-size-stat-icon)] tw:font-[var(--font-weight-bold)] tw:leading-[var(--line-height-32)] tw:text-[var(--color-grey-13)]"
  >
    {{ title }}
  </h2>

  <label
    class="field tw:m-0 tw:flex tw:min-w-0 tw:flex-col tw:gap-[var(--space-4)] tw:border-0 tw:p-0"
  >
    <span
      class="tw:[font-size:var(--font-size-meta)] tw:font-[var(--font-weight-medium)] tw:text-[var(--color-grey-46)]"
      >Title *</span
    >
    <input type="text" formControlName="title" autocomplete="off" required aria-required="true" />
    @if (showError('title', 'required') || showError('title', 'noWhitespace')) {
      <span class="tw:[font-size:var(--font-size-priority)] tw:text-[var(--color-red-51)]"
        >Title is required.</span
      >
    }
  </label>

  <label
    class="field tw:m-0 tw:flex tw:min-w-0 tw:flex-col tw:gap-[var(--space-4)] tw:border-0 tw:p-0"
  >
    <span
      class="tw:[font-size:var(--font-size-meta)] tw:font-[var(--font-weight-medium)] tw:text-[var(--color-grey-46)]"
      >Description *</span
    >
    <textarea formControlName="description" rows="4" required aria-required="true"></textarea>
    @if (showError('description', 'required') || showError('description', 'noWhitespace')) {
      <span class="tw:[font-size:var(--font-size-priority)] tw:text-[var(--color-red-51)]"
        >Description is required.</span
      >
    }
  </label>

  <div class="tw:grid tw:grid-cols-2 tw:gap-[var(--space-16)] tw:max-md:grid-cols-1">
    <label
      class="field tw:m-0 tw:flex tw:min-w-0 tw:flex-col tw:gap-[var(--space-4)] tw:border-0 tw:p-0"
    >
      <span
        class="tw:[font-size:var(--font-size-meta)] tw:font-[var(--font-weight-medium)] tw:text-[var(--color-grey-46)]"
        >Priority *</span
      >
      <select formControlName="priority" required aria-required="true">
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
      @if (showError('priority', 'required')) {
        <span class="tw:[font-size:var(--font-size-priority)] tw:text-[var(--color-red-51)]"
          >Priority is required.</span
        >
      }
    </label>

    <label
      class="field tw:m-0 tw:flex tw:min-w-0 tw:flex-col tw:gap-[var(--space-4)] tw:border-0 tw:p-0"
    >
      <span
        class="tw:[font-size:var(--font-size-meta)] tw:font-[var(--font-weight-medium)] tw:text-[var(--color-grey-46)]"
        >Status *</span
      >
      <select formControlName="status" required aria-required="true">
        <option value="todo">To Do</option>
        <option value="in_progress">In Progress</option>
        <option value="done">Done</option>
      </select>
      @if (showError('status', 'required')) {
        <span class="tw:[font-size:var(--font-size-priority)] tw:text-[var(--color-red-51)]"
          >Status is required.</span
        >
      }
    </label>
  </div>

  <div class="tw:grid tw:grid-cols-2 tw:gap-[var(--space-16)] tw:max-md:grid-cols-1">
    <label
      class="field tw:m-0 tw:flex tw:min-w-0 tw:flex-col tw:gap-[var(--space-4)] tw:border-0 tw:p-0"
    >
      <span
        class="tw:[font-size:var(--font-size-meta)] tw:font-[var(--font-weight-medium)] tw:text-[var(--color-grey-46)]"
        >Due Date *</span
      >
      <input type="date" formControlName="dueDate" required aria-required="true" />
      @if (showError('dueDate', 'required')) {
        <span class="tw:[font-size:var(--font-size-priority)] tw:text-[var(--color-red-51)]"
          >Due date is required.</span
        >
      } @else if (showError('dueDate', 'dueDate')) {
        <span class="tw:[font-size:var(--font-size-priority)] tw:text-[var(--color-red-51)]">{{
          dueDateMessage()
        }}</span>
      }
    </label>

    <label
      class="field tw:m-0 tw:flex tw:min-w-0 tw:flex-col tw:gap-[var(--space-4)] tw:border-0 tw:p-0"
    >
      <span
        class="tw:[font-size:var(--font-size-meta)] tw:font-[var(--font-weight-medium)] tw:text-[var(--color-grey-46)]"
        >Assignee *</span
      >
      <select formControlName="assigneeId" required aria-required="true">
        <option value="">Select assignee</option>
        @for (assignee of assignees(); track assignee.id) {
          <option [value]="assignee.id">{{ assignee.name }}</option>
        }
      </select>
      @if (showError('assigneeId', 'required')) {
        <span class="tw:[font-size:var(--font-size-priority)] tw:text-[var(--color-red-51)]"
          >Assignee is required.</span
        >
      }
    </label>
  </div>

  <fieldset
    class="field tw:m-0 tw:flex tw:min-w-0 tw:flex-col tw:gap-[var(--space-4)] tw:border-0 tw:p-0"
    formArrayName="tags"
  >
    <legend
      class="tw:mb-[var(--space-4)] tw:[font-size:var(--font-size-meta)] tw:font-[var(--font-weight-medium)] tw:text-[var(--color-grey-46)]"
    >
      Tags
    </legend>
    @for (tag of tags.controls; track $index) {
      <div class="tw:flex tw:gap-[var(--space-8)]">
        <input type="text" [formControlName]="$index" [attr.aria-label]="'Tag ' + ($index + 1)" />
        <button
          type="button"
          class="tag-row__remove tw:cursor-pointer tw:border-0 tw:bg-transparent tw:[font-size:var(--font-size-meta)] tw:font-[var(--font-weight-medium)] tw:text-[var(--color-azure-46)] tw:disabled:cursor-not-allowed tw:disabled:text-[var(--color-grey-46)] tw:disabled:opacity-40 tw:max-md:min-h-[var(--touch-target)]"
          [disabled]="tags.length <= 1"
          (click)="removeTag($index)"
        >
          Remove
        </button>
      </div>
      @if (showTagError($index, 'noWhitespace')) {
        <span class="tw:[font-size:var(--font-size-priority)] tw:text-[var(--color-red-51)]"
          >Tag cannot be only whitespace.</span
        >
      }
    }
    <button
      type="button"
      class="dialog__link tw:cursor-pointer tw:self-start tw:border-0 tw:bg-transparent tw:p-0 tw:[font-size:var(--font-size-meta)] tw:text-[var(--color-azure-46)]"
      (click)="addTag()"
    >
      Add tag
    </button>
  </fieldset>

  <div class="tw:flex tw:justify-end tw:gap-[var(--space-8)]">
    <button
      type="button"
      class="dialog__cancel tw:cursor-pointer tw:border-0 tw:bg-transparent tw:[font-size:var(--font-size-meta)] tw:text-[var(--color-grey-46)] tw:max-md:min-h-[var(--touch-target)]"
      (click)="cancel()"
    >
      Cancel
    </button>
    <button
      type="submit"
      class="dialog__submit tw:min-h-[var(--size-filter-tab-height)] tw:min-w-[var(--size-new-task-width)] tw:cursor-pointer tw:rounded-[var(--radius-4)] tw:border-0 tw:bg-[var(--color-azure-46)] tw:[font-size:var(--font-size-new-task)] tw:font-[var(--font-weight-medium)] tw:!text-[var(--color-white-solid)] tw:disabled:cursor-not-allowed tw:disabled:opacity-60 tw:max-md:min-h-[var(--touch-target)]"
      [disabled]="store.submitting()"
    >
      {{ store.submitting() ? 'Saving…' : isEdit ? 'Save' : 'Create' }}
    </button>
  </div>
</form>
