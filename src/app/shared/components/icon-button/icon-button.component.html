<button
  type="button"
  class="tw:inline-flex tw:items-center tw:justify-center tw:rounded-[var(--radius-4)] tw:border tw:border-transparent tw:bg-transparent tw:text-[var(--color-grey-13)] tw:cursor-pointer tw:transition tw:duration-150 tw:disabled:cursor-not-allowed tw:disabled:opacity-50"
  [class.tw:size-7]="size() === 'sm'"
  [class.tw:size-10]="size() === 'md'"
  [class.tw:size-12]="size() === 'lg'"
  [class.tw:w-full]="variant() === 'primary'"
  [class.tw:min-w-[192px]]="variant() === 'primary'"
  [class.tw:h-[30px]]="variant() === 'primary' || variant() === 'primary-compact'"
  [class.tw:w-12]="variant() === 'primary-compact'"
  [class.tw:rounded-[var(--radius-20)]]="variant() === 'ghost'"
  [class.hover:tw:bg-[var(--color-black-hover-5)]]="
    variant() === 'ghost' || variant() === 'outlined'
  "
  [class.tw:bg-[var(--color-azure-46)]]="variant() === 'primary' || variant() === 'primary-compact'"
  [class.tw:!text-[var(--color-white-solid)]]="
    variant() === 'primary' || variant() === 'primary-compact'
  "
  [class.hover:tw:shadow-[var(--shadow-todo-hover)]]="
    variant() === 'primary' || variant() === 'primary-compact'
  "
  [class.tw:border-[var(--color-grey-88)]]="variant() === 'outlined'"
  [attr.aria-label]="ariaLabel()"
  [disabled]="disabled()"
  (click)="clicked.emit($event)"
>
  <ng-content />
</button>
