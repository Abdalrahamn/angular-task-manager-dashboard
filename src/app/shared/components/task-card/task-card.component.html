<article
  class="tw:flex tw:min-h-[var(--size-task-card-min-height)] tw:w-full tw:flex-col tw:rounded-[var(--radius-8)] tw:border tw:border-[var(--color-grey-88)] tw:bg-[var(--color-white-solid)] tw:p-[var(--space-16)]"
  [class.task-card--overdue]="overdue()"
  [class.task-card--todo]="task().status === 'todo' && !overdue()"
  [class.task-card--in-progress]="task().status === 'in_progress' && !overdue()"
  [class.task-card--completed]="completed()"
>
  <div class="tw:flex tw:items-start tw:justify-between tw:gap-2">
    <span
      class="tw:rounded-[var(--radius-4)] tw:px-2 tw:py-1 tw:[font-size:var(--font-size-priority)] tw:font-[var(--font-weight-bold)] tw:leading-[var(--line-height-16)] tw:tracking-[var(--letter-spacing-0)] tw:uppercase data-[priority=high]:tw:bg-[var(--color-grey-96)] data-[priority=high]:tw:text-[var(--color-red-51)] data-[priority=medium]:tw:bg-[var(--color-grey-94)] data-[priority=medium]:tw:text-[var(--color-orange-48)] data-[priority=low]:tw:bg-[var(--color-grey-94)] data-[priority=low]:tw:text-[var(--color-green-39)]"
      [attr.data-priority]="task().priority"
      >{{ task().priority }}</span
    >
    <button
      type="button"
      class="task-card__menu tw:mt-[-8px] tw:mr-[-8px] tw:inline-flex tw:cursor-pointer tw:items-center tw:justify-center tw:border-0 tw:bg-transparent tw:p-0 tw:text-[var(--color-grey-46)]"
      aria-label="Task actions"
      [matMenuTriggerFor]="actions"
    >
      <app-more-vertical-icon width="16" height="16" iconClass="" />
    </button>
    <mat-menu #actions="matMenu" panelClass="task-card-menu">
      <button type="button" mat-menu-item (click)="edit.emit(task())">Edit</button>
      @if (task().status !== 'todo') {
        <button type="button" mat-menu-item (click)="move.emit({ task: task(), status: 'todo' })">
          Move to To Do
        </button>
      }
      @if (task().status !== 'in_progress') {
        <button
          type="button"
          mat-menu-item
          (click)="move.emit({ task: task(), status: 'in_progress' })"
        >
          Move to In Progress
        </button>
      }
      @if (task().status !== 'done') {
        <button type="button" mat-menu-item (click)="move.emit({ task: task(), status: 'done' })">
          Move to Done
        </button>
      }
      <button type="button" mat-menu-item (click)="remove.emit(task())">Delete</button>
    </mat-menu>
  </div>

  <h3
    class="task-card__title tw:mt-[var(--space-8)] tw:mb-0 tw:[font-size:var(--font-size-card-title)] tw:font-[var(--font-weight-medium)] tw:leading-[var(--line-height-224)] tw:text-[var(--color-grey-13)]"
  >
    {{ task().title }}
  </h3>
  <p
    class="tw:mt-[var(--space-4)] tw:mb-0 tw:line-clamp-2 tw:overflow-hidden tw:[font-size:var(--font-size-meta)] tw:leading-[var(--line-height-192)] tw:text-[var(--color-grey-46)]"
  >
    {{ task().description }}
  </p>

  <div
    class="task-card__status tw:mt-[var(--space-8)] tw:flex tw:items-center tw:gap-1 tw:[font-size:var(--font-size-meta)] tw:leading-[var(--line-height-192)] tw:text-[var(--color-grey-46)]"
  >
    <span class="task-card__status-icon tw:[font-size:14px] tw:leading-none" aria-hidden="true">{{
      statusIcon()
    }}</span>
    <span>{{ status().label }}</span>
  </div>

  @if (category(); as categoryLabel) {
    <span
      class="task-card__category tw:mt-[var(--space-8)] tw:[font-size:var(--font-size-meta)] tw:leading-[var(--line-height-192)] tw:text-[var(--color-grey-46)]"
      >{{ categoryLabel }}</span
    >
  }

  <footer
    class="tw:mt-auto tw:flex tw:items-center tw:gap-1 tw:border-t tw:border-[var(--color-grey-88)] tw:pt-[17px]"
  >
    <app-user-avatar class="tw:flex-none" [assignee]="task().assignee" />
    <span
      class="tw:[font-size:var(--font-size-meta)] tw:leading-[var(--line-height-192)] tw:text-[var(--color-grey-46)]"
      >{{ handle() }}</span
    >
  </footer>
</article>
