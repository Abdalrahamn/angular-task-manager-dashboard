<section>
  <h1
    class="tw:m-0 tw:text-[var(--font-size-stat-icon)] tw:font-[var(--font-weight-bold)] tw:leading-[var(--line-height-32)] tw:text-[var(--color-grey-13)]"
  >
    Tasks
  </h1>
  <p
    class="tw:mt-[var(--space-8)] tw:mb-0 tw:text-[var(--font-size-meta)] tw:leading-[var(--line-height-192)] tw:text-[var(--color-grey-46)]"
  >
    Use New Task to create work. The Kanban board and filters live on Dashboard.
  </p>
  <button
    type="button"
    class="tw:mt-[var(--space-16)] tw:inline-flex tw:h-[var(--size-filter-tab-height)] tw:min-w-[var(--size-new-task-width)] tw:items-center tw:gap-[var(--space-4)] tw:rounded-[var(--radius-4)] tw:border-0 tw:bg-[var(--color-azure-46)] tw:px-[var(--space-16)] tw:text-[var(--font-size-new-task)] tw:font-[var(--font-weight-medium)] tw:!text-[var(--color-white-solid)] tw:cursor-pointer"
    (click)="openCreate()"
  >
    <app-add-icon width="16" height="16" iconClass="" />
    New Task
  </button>
</section>
