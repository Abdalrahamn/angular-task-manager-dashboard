<section class="column">
  <header class="column__header">
    <h2 class="column__title">
      {{ title() }}
    </h2>
    <span class="column__count">{{ tasks().length }}</span>
  </header>

  <div
    class="column__list"
    cdkDropList
    [id]="status()"
    [cdkDropListData]="tasks()"
    [cdkDropListDisabled]="dragDisabled()"
    (cdkDropListDropped)="onDrop($event)"
  >
    @for (task of tasks(); track task.id) {
      <div class="column__item" cdkDrag [cdkDragData]="task" [cdkDragDisabled]="dragDisabled()">
        <app-task-card
          [task]="task"
          (edit)="editTask.emit($event)"
          (remove)="deleteTask.emit($event)"
          (move)="moveTask.emit($event)"
        />
      </div>
    } @empty {
      <app-empty-state
        title="No tasks"
        message="Nothing in this column yet. Drop a card here or use Move."
      />
    }
  </div>
</section>
